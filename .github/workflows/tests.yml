name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Surface pytest failures as annotations (diagnostics)
        if: failure()
        shell: bash
        run: |
          {
            echo "python: $(python --version 2>&1); uid=$(id -u); user=$(id -un)"
            grep -E '^(FAILED|ERROR) ' pytest.log | head -12
          } > failsum.txt || true
          msg=$(cut -c1-300 failsum.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=pytest failures::${msg}"
          grep -E '^E  ' pytest.log | cut -c1-250 | head -8 | while IFS= read -r line; do
            echo "::error title=first assertion errors::${line}"
          done
          tail -3 pytest.log | cut -c1-250 | while IFS= read -r line; do
            echo "::warning title=pytest tail::${line}"
          done
      - run: agentproof demo
